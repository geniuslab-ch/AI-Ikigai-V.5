<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Coach | AI-Ikigai</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="stylesheet" href="styles.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Sora:wght@400;600&display=swap"
        rel="stylesheet">

    <!-- Supabase & App Logic -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="coach-dashboard.js" defer></script>

    <style>
        /* DASHBOARD SPECIFIC STYLES */
        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            min-height: 80vh;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
        }

        .coach-profile {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .avatar-circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--gradient-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .stat-card {
            background: var(--dark-card);
            border: 1px solid var(--dark-border);
            padding: 1.5rem;
            border-radius: 16px;
            text-align: center;
        }

        .stat-value {
            font-family: 'Sora', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            background: var(--gradient-text);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .stat-label {
            color: var(--gray);
            font-size: 0.9rem;
        }

        /* Clients Section */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .btn-primary {
            background: var(--gradient-primary);
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
        }

        /* Table */
        .table-container {
            background: var(--dark-card);
            border-radius: 16px;
            border: 1px solid var(--dark-border);
            overflow: hidden;
        }

        .clients-table {
            width: 100%;
            border-collapse: collapse;
        }

        .clients-table th {
            background: rgba(255, 255, 255, 0.02);
            padding: 1rem 1.5rem;
            text-align: left;
            font-size: 0.9rem;
            color: var(--gray);
        }

        .clients-table td {
            padding: 1.5rem;
            border-bottom: 1px solid var(--dark-border);
            color: var(--light);
        }

        .client-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .client-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--dark-border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--purple);
            font-weight: 600;
        }

        .badge {
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            background: var(--dark-border);
        }

        .badge-success {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }

        .badge-warning {
            background: rgba(245, 158, 11, 0.2);
            color: #f59e0b;
        }

        .btn-icon {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 5px;
            transition: transform 0.2s;
        }

        .btn-icon:hover {
            transform: scale(1.2);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--dark-card);
            padding: 2.5rem;
            border-radius: 24px;
            border: 1px solid var(--dark-border);
            width: 90%;
            max-width: 500px;
            position: relative;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--gray);
        }

        .form-input {
            width: 100%;
            padding: 1rem;
            background: var(--dark);
            border: 1px solid var(--dark-border);
            border-radius: 12px;
            color: white;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--purple);
        }
    </style>
</head>

<body style="background: var(--dark); color: var(--light); font-family: 'Outfit', sans-serif;">

    <!-- Navbar -->
    <nav
        style="padding: 1.5rem 2rem; border-bottom: 1px solid var(--dark-border); display: flex; justify-content: space-between; align-items: center;">
        <div style="font-family: 'Sora', sans-serif; font-size: 1.5rem; font-weight: 700;">
            <span
                style="background: var(--gradient-text); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">AI-Ikigai</span>
            Coach
        </div>
        <button onclick="AuthAPI.signOut()"
            style="background: transparent; border: 1px solid var(--dark-border); color: var(--gray); padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer;">
            Déconnexion
        </button>
    </nav>

    <div class="dashboard-container">
        <!-- Header -->
        <div class="dashboard-header">
            <div>
                <h1 style="font-size: 2rem; margin-bottom: 0.5rem;">Bonjour, <span id="coach-name">Coach</span></h1>
                <p style="color: var(--gray);" id="coach-email">chargement...</p>
            </div>
            <div class="coach-profile">
                <div class="avatar-circle">C</div>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="stat-total">-</div>
                <div class="stat-label">Clients Total</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-active">-</div>
                <div class="stat-label">Actifs</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-pending">-</div>
                <div class="stat-label">En attente</div>
            </div>
        </div>

        <!-- Messages Area -->
        <div id="error-message"
            style="display:none; background: rgba(239, 68, 68, 0.2); color: #ef4444; padding: 1rem; border-radius: 12px; margin-bottom: 1rem;">
        </div>
        <div id="success-message"
            style="display:none; background: rgba(16, 185, 129, 0.2); color: #10b981; padding: 1rem; border-radius: 12px; margin-bottom: 1rem;">
        </div>

        <!-- Clients List -->
        <div class="section-header">
            <h2 style="font-size: 1.5rem;">Mes Clients</h2>
            <button class="btn-primary" onclick="openInviteModal()">
                + Inviter un client
            </button>
        </div>

        <div id="clients-list">
            <!-- Loading State -->
            <div style="text-align: center; padding: 4rem; color: var(--gray);">
                Chargement des clients...
            </div>
        </div>
    </div>

    <!-- Invite Modal -->
    <div id="invite-modal" class="modal">
        <div class="modal-content">
            <button class="close-modal"
                style="position: absolute; top: 1.5rem; right: 1.5rem; background: none; border: none; color: var(--gray); font-size: 1.5rem; cursor: pointer;">&times;</button>

            <h3 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Inviter un nouveau client</h3>
            <p style="color: var(--gray); margin-bottom: 2rem; font-size: 0.9rem;">
                Envoyez une invitation par email pour qu'il rejoigne votre espace.
            </p>

            <form id="invite-form">
                <div class="form-group">
                    <label class="form-label">Nom du client</label>
                    <input type="text" name="name" class="form-input" placeholder="Ex: Jean Dupont" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-input" placeholder="jean@exemple.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Message personnel (optionnel)</label>
                    <textarea name="message" class="form-input" rows="3"
                        placeholder="Bonjour, je vous invite à..."></textarea>
                </div>

                <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                    <button type="button" class="btn-cancel"
                        style="flex: 1; padding: 1rem; background: transparent; border: 1px solid var(--dark-border); color: var(--gray); border-radius: 12px; cursor: pointer;">Annuler</button>
                    <button type="submit" class="btn-primary" style="flex: 2; border-radius: 12px;">Envoyer
                        l'invitation</button>
                </div>
            </form>
        </div>
    </div>

</body>

</html>
