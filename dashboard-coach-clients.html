<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détails Client | Dashboard Coach</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="stylesheet" href="styles.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Sora:wght@400;600&display=swap"
        rel="stylesheet">

    <!-- Supabase & App Logic -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        .page-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--dark-border);
            color: var(--gray);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
        }

        .client-header {
            background: var(--dark-card);
            border: 1px solid var(--dark-border);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .analysis-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .analysis-card {
            background: var(--dark-card);
            border: 1px solid var(--dark-border);
            border-radius: 16px;
            padding: 1.5rem;
        }

        .card-title {
            font-family: 'Sora', sans-serif;
            font-size: 1.2rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--dark-border);
            padding-bottom: 0.5rem;
        }

        .tag-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .tag {
            background: rgba(139, 92, 246, 0.1);
            color: var(--purple);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        /* Points de Vigilance Special Style */
        .vigilance-card {
            border-color: rgba(245, 158, 11, 0.3);
            background: rgba(245, 158, 11, 0.05);
        }

        .vigilance-list li {
            margin-bottom: 0.5rem;
            color: var(--light);
            display: flex;
            gap: 0.5rem;
        }

        .vigilance-list li::before {
            content: "⚠️";
        }
    </style>
</head>

<body style="background: var(--dark); color: var(--light); font-family: 'Outfit', sans-serif;">

    <div style="max-width: 1200px; margin: 0 auto; padding: 2rem;">

        <div class="page-header">
            <a href="dashboard-coach.html" class="btn-back">← Retour</a>
            <h1 style="font-size: 1.5rem;">Dossier Client</h1>
        </div>

        <div id="loading" style="text-align: center; padding: 4rem; color: var(--gray);">
            Chargement du dossier client...
        </div>

        <div id="client-content" style="display: none;">

            <!-- Header Info -->
            <div class="client-header">
                <div>
                    <h2 id="client-name" style="font-size: 2rem; margin-bottom: 0.5rem;">-</h2>
                    <p id="client-email" style="color: var(--gray);">-</p>
                </div>
                <div style="text-align: right;">
                    <div style="font-size: 0.9rem; color: var(--gray);">Dernière analyse</div>
                    <div id="analysis-date" style="font-weight: 600;">-</div>
                </div>
            </div>

            <!-- Analysis Content -->
            <div class="analysis-grid">

                <!-- IKIGAI Score -->
                <div class="analysis-card">
                    <h3 class="card-title">✨ Score Ikigai</h3>
                    <div style="display: flex; justify-content: center; margin: 1rem 0;">
                        <canvas id="scoreChart" width="200" height="200"></canvas>
                    </div>
                </div>

                <!-- Points de Vigilance (Explicit Request) -->
                <div class="analysis-card vigilance-card">
                    <h3 class="card-title" style="color: #f59e0b;">⚠️ Points de Vigilance</h3>
                    <ul class="vigilance-list" id="vigilance-list">
                        <li style="color: var(--gray); font-style: italic;">Aucun point de vigilance détecté.</li>
                    </ul>
                </div>
            </div>

            <div class="analysis-grid">
                <!-- Passions -->
                <div class="analysis-card">
                    <h3 class="card-title">❤️ Passions</h3>
                    <div class="tag-container" id="passions-list"></div>
                </div>

                <!-- Talents -->
                <div class="analysis-card">
                    <h3 class="card-title">⭐ Talents</h3>
                    <div class="tag-container" id="talents-list"></div>
                </div>

                <!-- Mission -->
                <div class="analysis-card">
                    <h3 class="card-title">🌍 Mission</h3>
                    <div class="tag-container" id="mission-list"></div>
                </div>

                <!-- Vocation -->
                <div class="analysis-card">
                    <h3 class="card-title">💰 Vocation</h3>
                    <div class="tag-container" id="vocation-list"></div>
                </div>
            </div>

            <!-- Recommandations -->
            <div class="analysis-card">
                <h3 class="card-title">🚀 Recommandations Carrière</h3>
                <ul id="recommendations-list" style="padding-left: 1.5rem; line-height: 1.6;"></ul>
            </div>

        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Get Client ID from URL
            const urlParams = new URLSearchParams(window.location.search);
            const clientId = urlParams.get('client');

            if (!clientId) {
                alert('Aucun client spécifié');
                window.location.href = 'dashboard-coach.html';
                return;
            }

            try {
                // Fetch Client Profile
                const { data: client, error: clientError } = await window.supabaseClient
                    .from('profiles')
                    .select('*')
                    .eq('id', clientId)
                    .single();

                if (client) {
                    document.getElementById('client-name').textContent = client.name || client.email;
                    document.getElementById('client-email').textContent = client.email;
                }

                // Fetch Latest Analysis
                const { data: analysis, error: analysisError } = await window.supabaseClient
                    .from('analyses')
                    .select('*')
                    .eq('user_id', clientId)
                    .order('created_at', { ascending: false })
                    .limit(1)
                    .maybeSingle();

                if (analysis) {
                    renderAnalysis(analysis);
                } else {
                    document.getElementById('client-content').innerHTML = `
                        <div class="client-header">
                            <h2>${client?.name || 'Client'}</h2>
                        </div>
                        <div style="text-align: center; padding: 4rem; background: var(--dark-card); border-radius: 16px;">
                            <h3>Aucune analyse disponible</h3>
                            <p>Ce client n'a pas encore complété son questionnaire Ikigai.</p>
                        </div>
                    `;
                }

                document.getElementById('loading').style.display = 'none';
                document.getElementById('client-content').style.display = 'block';

            } catch (error) {
                console.error('Error loading client:', error);
                document.getElementById('loading').textContent = 'Erreur lors du chargement.';
            }
        });

        function renderAnalysis(data) {
            // Date
            document.getElementById('analysis-date').textContent = new Date(data.created_at).toLocaleDateString();

            // Tags Helpers
            const renderTags = (id, items) => {
                const container = document.getElementById(id);
                if (!items || items.length === 0) {
                    container.innerHTML = '<span style="color:var(--gray)">Non disponible</span>';
                    return;
                }
                container.innerHTML = items.map(item => `<span class="tag">${item}</span>`).join('');
            };

            renderTags('passions-list', data.passions);
            renderTags('talents-list', data.talents);
            renderTags('mission-list', data.mission);
            renderTags('vocation-list', data.vocation);

            // Recommendations
            const recList = document.getElementById('recommendations-list');
            if (data.career_recommendations) {
                recList.innerHTML = data.career_recommendations.map(req => `<li>${req}</li>`).join('');
            }

            // ✨ POINTS DE VIGILANCE (from coherence_diagnosis)
            const vigList = document.getElementById('vigilance-list');
            let points = [];

            if (data.coherence_diagnosis) {
                const diag = data.coherence_diagnosis;
                if (Array.isArray(diag)) {
                    points = diag;
                } else if (typeof diag === 'string') {
                    points = [diag];
                } else {
                    // Object structure: { strengths, misalignments, keyRisks, vigilance? }
                    if (diag.vigilance) points.push(...diag.vigilance);
                    if (diag.misalignments) points.push(...diag.misalignments);
                    if (diag.keyRisks) points.push(...diag.keyRisks);
                }
            }

            if (points.length > 0) {
                vigList.innerHTML = points.map(p => `<li>${p}</li>`).join('');
            } else {
                vigList.innerHTML = '<li style="color: var(--gray);">Aucun point critique identifié.</li>';
            }

            // Chart
            const ctx = document.getElementById('scoreChart').getContext('2d');
            const score = data.score || {};
            new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: ['Passion', 'Profession', 'Vocation', 'Mission'],
                    datasets: [{
                        label: 'Équilibre Ikigai',
                        data: [
                            score.passion || 0,
                            score.profession || 0,
                            score.vocation || 0,
                            score.mission || 0
                        ],
                        backgroundColor: 'rgba(139, 92, 246, 0.2)',
                        borderColor: '#8b5cf6',
                        borderWidth: 2
                    }]
                },
                options: {
                    scales: {
                        r: {
                            min: 0,
                            max: 100,
                            ticks: { display: false },
                            grid: { color: 'rgba(255,255,255,0.1)' }
                        }
                    }
                }
            });
        }
    </script>
</body>

</html>
